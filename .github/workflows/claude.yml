# Official Claude Code GitHub Action, interactive mode (responds to @claude).
# Source: https://code.claude.com/docs/en/github-actions (examples/claude.yml), adapted to
# subscription auth via the CLAUDE_CODE_OAUTH_TOKEN secret. Does nothing until the Claude GitHub App
# is installed and the secret exists. Only users with write access can trigger it.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 40"
